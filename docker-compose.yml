services:
  postgres:
    image: postgres:16-alpine
    container_name: loyaltycr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: loyaltycr
      POSTGRES_PASSWORD: loyaltycr_dev_password
      POSTGRES_DB: loyaltycr
    ports:
      - "5432:5432"
    volumes:
      - loyaltycr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyaltycr -d loyaltycr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  loyaltycr_postgres_data:
